name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: klockr
          POSTGRES_PASSWORD: klockr
          POSTGRES_DB: klockr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klockr -d klockr_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://klockr:klockr@localhost:5432/klockr_ci
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Database migrations + integration tests
        run: pnpm db:migrate && pnpm test:integration
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @klockr/web exec playwright install --with-deps chromium
      - name: E2E (Quick Timer, realtime, reconnect)
        run: pnpm test:e2e
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
